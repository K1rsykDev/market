{% extends 'base.html' %}
{% block content %}
<div class="form-card">
    <h2>{% if listing %}Редагувати оголошення{% else %}Нове оголошення{% endif %}</h2>
    <form method="post">
        <label>Категорія
            <select name="category" required>
                {% for option in categories %}
                    <option value="{{ option }}" {% if listing and listing.category == option %}selected{% endif %}>{{ option }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Назва предмета або авто <input type="text" name="title" value="{{ listing.title if listing else '' }}" required></label>
        <label>Ціна або бюджет <input type="number" step="0.01" name="price" value="{{ listing.price if listing else '' }}"></label>
        <label>Короткий опис
            <textarea name="description" rows="3" required>{{ listing.description if listing else '' }}</textarea>
        </label>
        <label>Discord для зв'язку <input type="text" name="contact_discord" value="{{ listing.contact_discord if listing else current_user.discord }}" required></label>
        <label>Фото (URL) <input type="url" name="image_url" value="{{ listing.image_url if listing else '' }}" placeholder="https://... (опціонально)"></label>
        <button class="btn" type="submit">Зберегти</button>
    </form>
</div>
{% endblock %}
