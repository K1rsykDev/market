{% extends 'base.html' %}
{% block content %}
<div class="form-card">
    <h2>Реєстрація</h2>
    <form method="post">
        <label>Логін <input type="text" name="username" required></label>
        <label>Пароль <input type="password" name="password" required></label>
        <label>Discord <input type="text" name="discord" placeholder="example#0000" required></label>
        <button class="btn" type="submit">Створити акаунт</button>
    </form>
    <p>Вже маєте акаунт? <a href="{{ url_for('login') }}">Увійдіть</a></p>
</div>
{% endblock %}
